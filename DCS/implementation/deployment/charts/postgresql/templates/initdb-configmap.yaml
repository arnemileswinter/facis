{{- if .Values.auth.additionalDatabases }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgresql-initdb
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  create-additional-dbs.sh: |
    #!/bin/bash
    set -e
    {{- range .Values.auth.additionalDatabases }}
    echo "Checking database: {{ . }}"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      SELECT 'CREATE DATABASE {{ . }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}')\gexec
      GRANT ALL PRIVILEGES ON DATABASE {{ . }} TO $POSTGRES_USER;
    EOSQL
    echo "Database {{ . }} ready"
    {{- end }}
  ensure-dbs.sh: |
    #!/bin/bash
    # Wait for postgres to be ready, then ensure databases exist
    until pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
      echo "Waiting for postgres..."
      sleep 2
    done
    /docker-entrypoint-initdb.d/create-additional-dbs.sh
{{- end }}
