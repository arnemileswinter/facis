    /template/approve:
        post:
            tags:
                - TemplateRepository
            summary: approve TemplateRepository
            description: mark template as approved, with optional decision notes.
            operationId: TemplateRepository#approve
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
