swagger: "2.0"
info:
    title: DCS API Server
    version: 0.0.1
host: 0.0.0.0:8991
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /archive/audit:
        get:
            tags:
                - ContractStorageArchive
            summary: audit ContractStorageArchive
            description: retrieve audit logs.
            operationId: ContractStorageArchive#audit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            type: string
                            example: Id voluptatem.
            schemes:
                - http
    /archive/delete:
        delete:
            tags:
                - ContractStorageArchive
            summary: delete ContractStorageArchive
            description: permanently delete entry.
            operationId: ContractStorageArchive#delete
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /archive/retrieve:
        get:
            tags:
                - ContractStorageArchive
            summary: retrieve ContractStorageArchive
            description: retrieve archived items.
            operationId: ContractStorageArchive#retrieve
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /archive/search:
        get:
            tags:
                - ContractStorageArchive
            summary: search ContractStorageArchive
            description: search archived records. search records by criteria.
            operationId: ContractStorageArchive#search
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            example: Sit impedit impedit est voluptas.
            schemes:
                - http
    /archive/store:
        post:
            tags:
                - ContractStorageArchive
            summary: store ContractStorageArchive
            description: store new contract or evidence.
            operationId: ContractStorageArchive#store
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /archive/terminate:
        post:
            tags:
                - ContractStorageArchive
            summary: terminate ContractStorageArchive
            description: terminate contract/archive entry.
            operationId: ContractStorageArchive#terminate
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /catalogue/template/discover:
        get:
            tags:
                - TemplateCatalogueIntegration
            summary: discover TemplateCatalogueIntegration
            description: Discover templates via XFSC Catalogue.
            operationId: TemplateCatalogueIntegration#discover
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /catalogue/template/register:
        post:
            tags:
                - TemplateCatalogueIntegration
            summary: register TemplateCatalogueIntegration
            description: Register template into XFSC Catalogue.
            operationId: TemplateCatalogueIntegration#register
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /catalogue/template/request:
        post:
            tags:
                - TemplateCatalogueIntegration
            summary: request TemplateCatalogueIntegration
            description: Request template via XFSC Catalogue.
            operationId: TemplateCatalogueIntegration#request
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /contract/approve:
        post:
            tags:
                - ContractWorkflowEngine
            summary: approve ContractWorkflowEngine
            description: approve and forward contract.
            operationId: ContractWorkflowEngine#approve
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /contract/audit:
        post:
            tags:
                - ContractWorkflowEngine
            summary: audit ContractWorkflowEngine
            description: generate audit record.
            operationId: ContractWorkflowEngine#audit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            type: string
                            example: Ea iure eos.
            schemes:
                - http
    /contract/create:
        post:
            tags:
                - ContractWorkflowEngine
            summary: create ContractWorkflowEngine
            description: initiate new contract draft from template.
            operationId: ContractWorkflowEngine#create
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /contract/negotiate:
        post:
            tags:
                - ContractWorkflowEngine
            summary: negotiate ContractWorkflowEngine
            description: propose changes.
            operationId: ContractWorkflowEngine#negotiate
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /contract/reject:
        post:
            tags:
                - ContractWorkflowEngine
            summary: reject ContractWorkflowEngine
            description: reject with explanation.
            operationId: ContractWorkflowEngine#reject
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /contract/respond:
        post:
            tags:
                - ContractWorkflowEngine
            summary: respond ContractWorkflowEngine
            description: provide feedback/findings. respond to counterpart changes.
            operationId: ContractWorkflowEngine#respond
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /contract/retrieve:
        get:
            tags:
                - ContractWorkflowEngine
            summary: retrieve ContractWorkflowEngine
            description: fetch submitted contract. fetch reviewed contract. fetch contract(s).
            operationId: ContractWorkflowEngine#retrieve
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /contract/review:
        get:
            tags:
                - ContractWorkflowEngine
            summary: review ContractWorkflowEngine
            description: retrieve latest draft for comparison.
            operationId: ContractWorkflowEngine#review
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /contract/search:
        get:
            tags:
                - ContractWorkflowEngine
            summary: search ContractWorkflowEngine
            description: locate contracts by metadata or state. filter/search across lifecycle states.
            operationId: ContractWorkflowEngine#search
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            example: Occaecati omnis.
            schemes:
                - http
    /contract/store:
        post:
            tags:
                - ContractWorkflowEngine
            summary: store ContractWorkflowEngine
            description: store evidence.
            operationId: ContractWorkflowEngine#store
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /contract/submit:
        post:
            tags:
                - ContractWorkflowEngine
            summary: submit ContractWorkflowEngine
            description: finalize and submit contract for negotiation/review. finalize and submit negotiated version. finalize review outcome. finalize decision. finalize review outcome.
            operationId: ContractWorkflowEngine#submit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /contract/terminate:
        post:
            tags:
                - ContractWorkflowEngine
            summary: terminate ContractWorkflowEngine
            description: terminate a contract.
            operationId: ContractWorkflowEngine#terminate
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /external/action:
        post:
            tags:
                - ExternalTargetSystemApi
            summary: action ExternalTargetSystemApi
            description: Invoke external target system action (create/deploy) from DCS.
            operationId: ExternalTargetSystemApi#action
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /external/callback:
        post:
            tags:
                - ExternalTargetSystemApi
            summary: callback ExternalTargetSystemApi
            description: Receive external target system callbacks/events into DCS.
            operationId: ExternalTargetSystemApi#callback
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /external/status:
        get:
            tags:
                - ExternalTargetSystemApi
            summary: status ExternalTargetSystemApi
            description: Query external target system status from DCS.
            operationId: ExternalTargetSystemApi#status
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /pac/audit:
        post:
            tags:
                - ProcessAuditAndCompliance
            summary: audit ProcessAuditAndCompliance
            description: trigger an audit on selected scope.
            operationId: ProcessAuditAndCompliance#audit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /pac/monitor:
        get:
            tags:
                - ProcessAuditAndCompliance
            summary: monitor ProcessAuditAndCompliance
            description: continuous monitoring and event retrieval.
            operationId: ProcessAuditAndCompliance#monitor
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /pac/report:
        get:
            tags:
                - ProcessAuditAndCompliance
            summary: audit_report ProcessAuditAndCompliance
            description: generate and retrieve audit reports.
            operationId: ProcessAuditAndCompliance#audit_report
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
        post:
            tags:
                - ProcessAuditAndCompliance
            summary: incident_report ProcessAuditAndCompliance
            description: submit non-compliance findings as case records.
            operationId: ProcessAuditAndCompliance#incident_report
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /peer/retrieve:
        get:
            tags:
                - DcsToDcs
            summary: retrieve DcsToDcs
            description: Offer a policy-gated, read-only contract information endpoint between a DCS instance and a counterparty DCS
            operationId: DcsToDcs#retrieve
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /signature/apply:
        post:
            tags:
                - SignatureManagement
            summary: apply SignatureManagement
            description: apply digital signature.
            operationId: SignatureManagement#apply
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /signature/audit:
        get:
            tags:
                - SignatureManagement
            summary: audit SignatureManagement
            description: retrieve compliance/audit logs.
            operationId: SignatureManagement#audit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            type: string
                            example: Et beatae assumenda architecto quaerat.
            schemes:
                - http
    /signature/compliance:
        post:
            tags:
                - SignatureManagement
            summary: compliance SignatureManagement
            description: run compliance check.
            operationId: SignatureManagement#compliance
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /signature/retrieve:
        get:
            tags:
                - SignatureManagement
            summary: retrieve SignatureManagement
            description: fetch contract & envelope.
            operationId: SignatureManagement#retrieve
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /signature/revoke:
        post:
            tags:
                - SignatureManagement
            summary: revoke SignatureManagement
            description: revoke a signature.
            operationId: SignatureManagement#revoke
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /signature/validate:
        post:
            tags:
                - SignatureManagement
            summary: validate SignatureManagement
            description: validate applied signature. validate contract signature(s).
            operationId: SignatureManagement#validate
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /signature/verify:
        post:
            tags:
                - SignatureManagement
            summary: verify SignatureManagement
            description: check contract integrity & envelope.
            operationId: SignatureManagement#verify
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /template/approve:
        post:
            tags:
                - TemplateRepository
            summary: approve TemplateRepository
            description: mark template as approved, with optional decision notes.
            operationId: TemplateRepository#approve
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /template/archive:
        post:
            tags:
                - TemplateRepository
            summary: archive TemplateRepository
            description: archive obsolete template.
            operationId: TemplateRepository#archive
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /template/audit:
        get:
            tags:
                - TemplateRepository
            summary: audit TemplateRepository
            description: retrieve audit history of template actions.
            operationId: TemplateRepository#audit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            type: string
                            example: Dolorum accusantium ut nesciunt voluptatem.
            schemes:
                - http
    /template/create:
        post:
            tags:
                - TemplateRepository
            summary: create TemplateRepository
            description: Create a new template.
            operationId: TemplateRepository#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ContractTemplateCreateRequest'
                    required:
                        - created_by
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ContractTemplateCreateResult'
                        required:
                            - did
                            - document_number
                            - version
                            - state
                            - created_by
                            - created_at
                            - meta_data
            schemes:
                - http
    /template/register:
        post:
            tags:
                - TemplateRepository
            summary: register TemplateRepository
            description: register new template into the repository.
            operationId: TemplateRepository#register
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /template/reject:
        post:
            tags:
                - TemplateRepository
            summary: reject TemplateRepository
            description: mark template as rejected, requiring reason field.
            operationId: TemplateRepository#reject
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /template/retrieve:
        get:
            tags:
                - TemplateRepository
            summary: retrieve TemplateRepository
            description: load submitted template and history/provenance summary. fetch reviewed template with metadata, review history, and validation results. fetch all template entries for dashboard view.
            operationId: TemplateRepository#retrieve
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /template/retrieve/{template_id}:
        get:
            tags:
                - TemplateRepository
            summary: retrieve_by_id TemplateRepository
            description: Retrieve a template by template id.
            operationId: TemplateRepository#retrieve_by_id
            parameters:
                - name: template_id
                  in: path
                  description: Template ID
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /template/search:
        get:
            tags:
                - TemplateRepository
            summary: search TemplateRepository
            description: perform filtered searches.
            operationId: TemplateRepository#search
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            example: Adipisci et culpa nihil.
            schemes:
                - http
    /template/submit:
        post:
            tags:
                - TemplateRepository
            summary: submit TemplateRepository
            description: 'with action flag { forwardTo: "approval" | "draft" } and optional reviewComments. allow resubmission path with approver comments.'
            operationId: TemplateRepository#submit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /template/update:
        put:
            tags:
                - TemplateRepository
            summary: update TemplateRepository
            description: persist reviewer edits (metadata/clauses/semantics).
            operationId: TemplateRepository#update
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
        post:
            tags:
                - TemplateRepository
            summary: update_manage TemplateRepository
            description: update metadata or status.
            operationId: TemplateRepository#update_manage
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /template/verify:
        post:
            tags:
                - TemplateRepository
            summary: verify TemplateRepository
            description: run policy, schema, and semantic validations; return findings.
            operationId: TemplateRepository#verify
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /webhook/node-red:
        post:
            tags:
                - OrchestrationWebhooks
            summary: node_red_webhook OrchestrationWebhooks
            description: Expose Node-Red - compatible endpoints and webhook callbacks.
            operationId: OrchestrationWebhooks#node_red_webhook
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
definitions:
    ContractTemplateCreateRequest:
        title: ContractTemplateCreateRequest
        type: object
        properties:
            created_by:
                type: string
                description: Identifier of who created the contract template
                example: Ullam eos assumenda qui quis porro.
            description:
                type: string
                description: A description for that template
                example: Qui hic aperiam dolor dolores.
            meta_data:
                description: The metadata of the contract template
                example: Id aspernatur et voluptatem dolores dolores.
            name:
                type: string
                description: The name of the contract template
                example: Sed odit assumenda maxime.
        example:
            created_by: Sequi rem odio facilis est.
            description: Hic enim cum neque et repellat enim.
            meta_data: Qui in voluptas delectus tempora velit quod.
            name: Sed ullam minus quo nam.
        required:
            - created_by
    ContractTemplateCreateResult:
        title: ContractTemplateCreateResult
        type: object
        properties:
            created_at:
                type: string
                description: The timestamp when the contract template was created
                example: Aut aut.
            created_by:
                type: string
                description: Identifier of who created the contract template
                example: Et eius molestiae recusandae.
            description:
                type: string
                description: A description for that template
                example: Natus laudantium.
            did:
                type: string
                description: Decentralized Identifier of the contract template
                example: Quasi id autem.
            document_number:
                type: integer
                description: The document number of the contract template
                example: 9206763425114248083
                format: int64
            meta_data:
                description: The metadata of the contract template
                example: Dicta voluptatem est dolor ut.
            name:
                type: string
                description: The name of the contract template
                example: Iure eos esse ratione consequatur.
            state:
                type: string
                description: The state of the contract template
                example: Ducimus et.
            version:
                type: integer
                description: The version number of the contract template
                example: 7302364942790791781
                format: int64
        example:
            created_at: Voluptatem natus illo.
            created_by: Nihil porro qui totam.
            description: Mollitia at.
            did: Provident soluta aliquid deleniti rerum voluptatem.
            document_number: 3165328423837621283
            meta_data: Et voluptatem et aliquam ut.
            name: Nesciunt ut.
            state: Et laudantium magni nobis.
            version: 3680368804788694355
        required:
            - did
            - document_number
            - version
            - state
            - created_by
            - created_at
            - meta_data
