                - http
    /template/archive:
        post:
            tags:
                - TemplateRepository
            summary: archive TemplateRepository
            description: archive obsolete template.
            operationId: TemplateRepository#archive
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /template/audit:
        get:
            tags:
                - TemplateRepository
            summary: audit TemplateRepository
            description: retrieve audit history of template actions.
            operationId: TemplateRepository#audit
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            type: string
                            example: Dolor totam nihil dolorum et aspernatur vitae.
            schemes:
                - http
    /template/create:
        post:
            tags:
                - TemplateRepository
            summary: create TemplateRepository
            description: Create a new template.
            operationId: TemplateRepository#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ContractTemplateCreateRequest'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ContractTemplateCreateResponse'
                        required:
                            - did
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryCreateBadRequestResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryCreateInternalErrorResponseBody'
            schemes:
                - http
    /template/register:
        post:
            tags:
                - TemplateRepository
            summary: register TemplateRepository
            description: register new template into the repository.
            operationId: TemplateRepository#register
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /template/reject:
        post:
            tags:
                - TemplateRepository
            summary: reject TemplateRepository
            description: mark template as rejected, requiring reason field.
            operationId: TemplateRepository#reject
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /template/retrieve:
        get:
            tags:
                - TemplateRepository
            summary: retrieve TemplateRepository
            description: load submitted template and history/provenance summary. fetch reviewed template with metadata, review history, and validation results. fetch all template entries for dashboard view.
            operationId: TemplateRepository#retrieve
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/ContractTemplateRetrieveResponse'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryRetrieveBadRequestResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryRetrieveInternalErrorResponseBody'
            schemes:
                - http
    /template/retrieve/{template_id}:
        get:
            tags:
                - TemplateRepository
            summary: retrieve_by_id TemplateRepository
            description: Retrieve a template by template id.
            operationId: TemplateRepository#retrieve_by_id
            parameters:
                - name: template_id
                  in: path
                  description: ID of the contract template
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ContractTemplateRetrieveByIDResponse'
                        required:
                            - did
                            - document_number
                            - version
                            - state
                            - created_by
                            - created_at
                            - meta_data
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryRetrieveByIDBadRequestResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryRetrieveByIDInternalErrorResponseBody'
            schemes:
                - http
    /template/search:
        get:
            tags:
                - TemplateRepository
            summary: search TemplateRepository
            description: perform filtered searches.
            operationId: TemplateRepository#search
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            example: Vero nesciunt doloremque quis rerum.
            schemes:
                - http
    /template/submit:
        post:
            tags:
                - TemplateRepository
            summary: submit TemplateRepository
            description: 'with action flag { forwardTo: "approval" | "draft" } and optional reviewComments. allow resubmission path with approver comments.'
            operationId: TemplateRepository#submit
            parameters:
                - name: SubmitRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/TemplateContractSubmitRequest'
                    required:
                        - did
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TemplateContractSubmitResponse'
                        required:
                            - did
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/TemplateRepositorySubmitBadRequestResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/TemplateRepositorySubmitInternalErrorResponseBody'
            schemes:
                - http
    /template/update:
        put:
            tags:
                - TemplateRepository
            summary: update TemplateRepository
            description: persist reviewer edits (metadata/clauses/semantics).
            operationId: TemplateRepository#update
            parameters:
                - name: UpdateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ContractTemplateUpdateRequest'
                    required:
                        - did
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ContractTemplateUpdateResponse'
                        required:
                            - did
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryUpdateBadRequestResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/TemplateRepositoryUpdateInternalErrorResponseBody'
            schemes:
                - http
        post:
            tags:
                - TemplateRepository
            summary: update_manage TemplateRepository
            description: update metadata or status.
            operationId: TemplateRepository#update_manage
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: integer
                        format: int64
            schemes:
                - http
    /template/verify:
        post:
            tags:
                - TemplateRepository
            summary: verify TemplateRepository
            description: run policy, schema, and semantic validations; return findings.
            operationId: TemplateRepository#verify
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
    /webhook/node-red:
        post:
            tags:
                - OrchestrationWebhooks
            summary: node_red_webhook OrchestrationWebhooks
            description: Expose Node-Red - compatible endpoints and webhook callbacks.
            operationId: OrchestrationWebhooks#node_red_webhook
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
definitions:
    ContractTemplateCreateRequest:
        title: ContractTemplateCreateRequest
        type: object
        properties:
            description:
                type: string
                description: A description for that template
                example: Impedit tenetur earum.
            meta_data:
                description: The metadata of the contract template
                example: Doloribus autem est sit ut sit quisquam.
            name:
                type: string
                description: The name of the contract template
                example: Sed quia.
        example:
            description: Est est quaerat ipsum.
            meta_data: In sit doloribus sequi molestiae dolor.
            name: Aliquid asperiores occaecati voluptas.
    ContractTemplateCreateResponse:
        title: ContractTemplateCreateResponse
        type: object
        properties:
            did:
                type: string
                description: Decentralized Identifier of the contract template
                example: Libero consequatur voluptas recusandae ex quia.
        example:
            did: Aut velit.
        required:
            - did
    ContractTemplateRetrieveByIDResponse:
        title: ContractTemplateRetrieveByIDResponse
        type: object
        properties:
            created_at:
                type: string
                description: The timestamp when the contract template was created
                example: Officiis distinctio odit ullam.
            created_by:
                type: string
                description: Identifier of who created the contract template
                example: Dolorum dolore sed ullam in.
            description:
                type: string
                description: A description for that template
                example: Quos dolorem velit hic nesciunt quidem.
            did:
                type: string
                description: Decentralized Identifier of the contract template
                example: Nihil nemo.
            document_number:
                type: integer
                description: The document number of the contract template
                example: 9186970259492788194
                format: int64
            meta_data:
                description: The metadata of the contract template
                example: In ut.
            name:
                type: string
                description: The name of the contract template
                example: Distinctio ut quia doloribus similique.
            state:
                type: string
                description: The state of the contract template
                example: Magnam nesciunt optio et fuga sint.
            version:
                type: integer
                description: The version number of the contract template
                example: 8231484647052873427
                format: int64
        example:
            created_at: Non aut veniam omnis provident.
            created_by: Consequatur mollitia reprehenderit ipsum cupiditate deserunt quo.
            description: Quas illo voluptas minima eum.
            did: Temporibus tempora vel quod quia maiores eligendi.
            document_number: 1923614972211560587
            meta_data: Laudantium unde labore ut.
            name: Eos ut esse quaerat voluptatem.
            state: Et consequatur unde.
            version: 2205675300083513287
        required:
            - did
            - document_number
            - version
            - state
            - created_by
            - created_at
            - meta_data
    ContractTemplateRetrieveResponse:
        title: ContractTemplateRetrieveResponse
        type: object
        properties:
            created_at:
                type: string
                description: The timestamp when the contract template was created
                example: Et qui voluptatem.
            created_by:
                type: string
                description: Identifier of who created the contract template
                example: Repellendus vitae non perspiciatis qui quia.
            description:
                type: string
                description: A description for that template
                example: Odio repellat.
            did:
                type: string
                description: Decentralized Identifier of the contract template
                example: Ab occaecati.
            document_number:
                type: integer
                description: The document number of the contract template
                example: 7679321603498397396
                format: int64
            meta_data:
                description: The metadata of the contract template
                example: Magnam non quod nam vero qui.
            name:
                type: string
                description: The name of the contract template
                example: Ea molestiae omnis nihil eaque sed.
            state:
                type: string
                description: The state of the contract template
                example: Aut quia doloremque quia velit eum.
            version:
                type: integer
                description: The version number of the contract template
                example: 4886243766224147034
                format: int64
        description: Result for retrieving a contract template
        example:
            created_at: Quisquam qui tenetur.
            created_by: Consectetur quaerat recusandae.
            description: Magnam optio numquam.
            did: Ut et ut sit quasi.
            document_number: 3957154943936604085
            meta_data: Sint optio aut molestiae quas.
            name: Voluptate labore molestiae excepturi est delectus voluptas.
            state: Saepe non.
            version: 2883662058905647401
        required:
            - did
            - document_number
            - version
            - state
            - created_by
            - created_at
            - meta_data
    ContractTemplateUpdateRequest:
        title: ContractTemplateUpdateRequest
        type: object
        properties:
            description:
                type: string
                description: A description for that template
                example: Delectus iste architecto ducimus consequatur.
            did:
                type: string
                description: Decentralized Identifier of the contract template
                example: Necessitatibus harum rem rerum veritatis voluptates.
            meta_data:
                description: The metadata of the contract template
                example: Ducimus omnis aut omnis ut.
            name:
                type: string
                description: The name of the contract template
                example: Temporibus soluta.
        example:
            description: Sed dicta possimus et.
            did: Vero suscipit perspiciatis consequuntur vero nulla.
            meta_data: Id facilis odit repudiandae harum.
            name: Et ipsum nostrum adipisci sequi quia.
        required:
            - did
    ContractTemplateUpdateResponse:
        title: ContractTemplateUpdateResponse
        type: object
        properties:
            did:
                type: string
                description: Decentralized Identifier of the contract template
                example: Et accusantium dolorem architecto.
        example:
            did: Facilis molestiae.
        required:
            - did
    TemplateContractSubmitRequest:
        title: TemplateContractSubmitRequest
        type: object
        properties:
            did:
                type: string
                description: Decentralized Identifier of the contract template
                example: Id dolor commodi aliquam aliquid sit suscipit.
            forward_to:
                type: string
                description: 'Action flag: approval | draft'
                example: Ut reiciendis qui eius eaque fuga magnam.
            review_comments:
                type: array
