components:
    schemas:
        ContractTemplateCreateRequest:
            type: object
            properties:
                description:
                    type: string
                    description: A description for that template
                    example: Aut maiores.
                meta_data:
                    description: The metadata of the contract template
                    example: Sit beatae eius aspernatur.
                name:
                    type: string
                    description: The name of the contract template
                    example: Architecto non facilis molestiae numquam ipsum.
            description: Contract template create request
            example:
                description: Voluptates perferendis.
                meta_data: Soluta ratione delectus.
                name: Eum rerum necessitatibus harum rem rerum.
        ContractTemplateCreateResponse:
            type: object
            properties:
                did:
                    type: string
                    description: Decentralized Identifier of the contract template
                    example: Architecto ducimus consequatur eius ducimus.
            description: Result for creating a contract template
            example:
                did: Aut omnis ut.
            required:
                - did
        ContractTemplateRetrieveByIDRequest:
            type: object
            properties:
                template_id:
                    type: string
                    description: ID of the contract template
                    example: Qui quia qui et qui.
            description: Contract template retrieve by id request
            example:
                template_id: Temporibus magnam non quod nam vero.
            required:
                - template_id
        ContractTemplateRetrieveByIDResponse:
            type: object
            properties:
                created_at:
                    type: string
                    description: The timestamp when the contract template was created
                    example: Tenetur tenetur sint.
                created_by:
                    type: string
                    description: Identifier of who created the contract template
                    example: Numquam natus consectetur quaerat recusandae voluptates quisquam.
                description:
                    type: string
                    description: A description for that template
                    example: Aut magnam.
                did:
                    type: string
                    description: Decentralized Identifier of the contract template
                    example: Aut ut et.
                document_number:
                    type: integer
                    description: The document number of the contract template
                    example: 8375963361293225902
                    format: int64
                meta_data:
                    description: The metadata of the contract template
                    example: Aut molestiae quas nihil molestias id illo.
                name:
                    type: string
                    description: The name of the contract template
                    example: Molestiae excepturi est delectus.
                state:
                    type: string
                    description: The state of the contract template
                    example: Atque adipisci rem saepe non hic voluptate.
                version:
                    type: integer
                    description: The version number of the contract template
                    example: 6362157887326178555
                    format: int64
            description: Result for retrieving a contract template by id
            example:
                created_at: Nesciunt quidem ab dolorum dolore sed ullam.
                created_by: Similique omnis quos dolorem velit.
                description: Et fuga sint vero distinctio ut quia.
                did: Possimus minima.
                document_number: 3782613407414815751
                meta_data: Repudiandae officiis distinctio odit ullam veritatis in.
                name: Exercitationem enim magnam nesciunt.
                state: Libero facilis aspernatur nihil nemo.
                version: 2030500950336951852
            required:
                - did
                - document_number
                - version
                - state
                - created_by
                - created_at
                - meta_data
        ContractTemplateUpdateRequest:
            type: object
            properties:
                description:
                    type: string
                    description: A description for that template
                    example: Sed dicta possimus et.
                did:
                    type: string
                    description: Decentralized Identifier of the contract template
                    example: Vero suscipit perspiciatis consequuntur vero nulla.
                meta_data:
                    description: The metadata of the contract template
                    example: Id facilis odit repudiandae harum.
                name:
                    type: string
                    description: The name of the contract template
                    example: Et ipsum nostrum adipisci sequi quia.
            description: Contract template update request
            example:
                description: Et qui aut quia doloremque.
                did: Vero nesciunt doloremque quis rerum.
                meta_data: Velit eum non ea molestiae.
                name: Ab occaecati.
            required:
                - did
        ContractTemplateUpdateResponse:
            type: object
            properties:
                did:
                    type: string
                    description: Decentralized Identifier of the contract template
                    example: Nihil eaque.
            description: Result for updating a contract template
            example:
                did: Veritatis odio repellat neque repellendus vitae non.
            required:
                - did
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: true
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: true
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            description: Bad request
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: false
                timeout: true
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
