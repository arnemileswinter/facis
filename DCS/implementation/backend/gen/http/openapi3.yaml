            description: run policy, schema, and semantic validations; return findings.
            operationId: TemplateRepository#verify
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                example: Ut amet dolor provident quia velit.
                            example: Quia aperiam quisquam et non.
    /webhook/node-red:
