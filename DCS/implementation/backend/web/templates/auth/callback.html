<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Successful</title>
    <script>
        async function refreshToken() {
            try {
                const response = await fetch('/auth/refresh', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    document.getElementById('refresh-result').innerHTML = '<p>Error refreshing token</p>';
                    return;
                }
                
                const data = await response.json();
                
                document.getElementById('refreshed-access-token').textContent = data.access_token;
                document.getElementById('refreshed-token-type').textContent = data.token_type;
                document.getElementById('refreshed-expires-in').textContent = data.expires_in + ' seconds';
                document.getElementById('refresh-result').style.display = 'block';
            } catch (error) {
                document.getElementById('refresh-result').innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }
    </script>
</head>
<body>
    <h1>Authentication Successful</h1>
    <div>
        <label>Access Token:</label>
        <pre>{{.AccessToken}}</pre>
    </div>
    <div>
        <label>Token Type:</label>
        <pre>{{.TokenType}}</pre>
    </div>
    <div>
        <label>Expires In:</label>
        <pre>{{.ExpiresIn}} seconds</pre>
    </div>
    <p>Refresh token stored securely in HttpOnly cookie</p>

    <div>
        <h2>Token Refresh</h2>
        <p>Click the button below to refresh your access token using the stored refresh token:</p>
        <button onclick="refreshToken()">Refresh Access Token</button>
        
        <div id="refresh-result" style="display: none; margin-top: 20px;">
            <h3>Refreshed Token</h3>
            <div>
                <label>New Access Token:</label>
                <pre id="refreshed-access-token"></pre>
            </div>
            <div>
                <label>Token Type:</label>
                <pre id="refreshed-token-type"></pre>
            </div>
            <div>
                <label>Expires In:</label>
                <pre id="refreshed-expires-in"></pre>
            </div>
        </div>
    </div>
</body>
</html>
